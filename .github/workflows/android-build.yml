name: Android APK

# Builds a signed release APK straight from the repo — no EAS quota involved.
# Runs on every push to main that touches app code, and manually.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'native-modules/**'
      - 'theme/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/workout-alarm.p12

      - name: Expo prebuild (generate android/ with config plugins)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
          WORKOUT_ALARM_KEYSTORE_FILE: /tmp/workout-alarm.p12
          WORKOUT_ALARM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WORKOUT_ALARM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORKOUT_ALARM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
        env:
          CI: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-alarm-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
