name: Android APK

# Builds a debug APK straight from the repo — no EAS quota involved.
# Runs on every push to main that touches app code, and manually.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'native-modules/**'
      - 'theme/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (generate android/ with config plugins)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
        env:
          CI: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-alarm-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
