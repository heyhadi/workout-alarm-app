name: Android APK

# Builds a signed release APK straight from the repo — no EAS quota involved.
# Runs on every push to main that touches app code, and manually.
# Each build is stamped with the run number (android versionCode) and
# published as GitHub release `build-<N>`; the app's in-app updater
# offers it to installed builds with a lower number.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'native-modules/**'
      - 'theme/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the build-<N> release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp build version
        run: |
          python3 -c "
          import json
          with open('app.json') as f: cfg = json.load(f)
          run = int('${{ github.run_number }}')
          cfg['expo']['version'] = f'1.0.{run}'
          cfg['expo'].setdefault('android', {})['versionCode'] = run
          with open('app.json', 'w') as f: json.dump(cfg, f, indent=2)
          print('version:', cfg['expo']['version'], 'versionCode:', run)
          "   

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Stamp build number
        # versionCode = run number, so every build is newer than the last.
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android.versionCode = Number(process.env.BUILD_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/workout-alarm.p12

      - name: Expo prebuild (generate android/ with config plugins)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
          WORKOUT_ALARM_KEYSTORE_FILE: /tmp/workout-alarm.p12
          WORKOUT_ALARM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WORKOUT_ALARM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WORKOUT_ALARM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon
        env:
          CI: 1
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-alarm-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Publish release
        # Only from main: the in-app updater installs whatever is "latest".
        if: github.ref == 'refs/heads/main'
        run: |
          APK="workout-alarm-build-${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "build-${BUILD_NUMBER}" "$APK" \
            --title "Build ${BUILD_NUMBER}" \
            --notes "$COMMIT_MESSAGE" \
            --target "$GITHUB_SHA" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          # Passed as data, never interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual build' }}
